[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reanime-mpv"
version = "1.3.0"
description = "Stream anime from reanime.to in mpv, English dubs included - interactive picker, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vashistha Pandya" }]
keywords = ["anime", "dub", "mpv", "cli", "streaming"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []  # stdlib only, by design

[project.urls]
Homepage = "https://github.com/vashhdev/reanime"
Issues = "https://github.com/vashhdev/reanime/issues"

[project.scripts]
reanime = "reanime:main"

[tool.setuptools]
py-modules = ["reanime"]

[tool.ruff]
target-version = "py38"
line-length = 110

[tool.ruff.lint]
# pyflakes, pycodestyle errors, bugbear. E401: `import termios, tty, select` is the
# onepace house style for the optional POSIX imports
select = ["E", "F", "B", "W"]
ignore = ["E401"]
