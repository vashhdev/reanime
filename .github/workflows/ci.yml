# reanime health pipeline. each stage only runs if the one before it is green:
#
#   1 lint -> 2 test -> 3 build -> 4 install -> 6 release (tags only)
#                    \-> 5 live site check
#
# runs on every push and pull request, daily (to catch reanime/flixcloud changes and
# runner image drift), on demand from the Actions tab, and on v* tags to release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 1 · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: ruff (reanime.py, tests)
        run: uvx ruff check --output-format github .
      - name: shellcheck (install.sh)
        run: shellcheck install.sh
      - name: parse (install.ps1)
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }

  test:
    name: 2 · test (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: unit tests (offline, fixtures)
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - name: cli smoke
        run: |
          uv run --no-project --python ${{ matrix.python }} python reanime.py --version
          uv run --no-project --python ${{ matrix.python }} python reanime.py --help

  build:
    name: 3 · build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: sdist + wheel
        run: uv build
      - name: check package metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install:
    # the real one-line installers on fresh machines (no uv, no mpv), installing the
    # wheel from stage 3, then mpv through the system package manager, then playing
    # a generated test clip through whatever player reanime found
    name: 4 · install (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REANIME_YES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: install.sh, piped like curl | sh
        if: runner.os != 'Windows'
        run: |
          export REANIME_PKG="$(ls "$PWD"/dist/*.whl)"
          sh < install.sh
      - name: install.ps1, piped like irm | iex
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:REANIME_PKG = (Get-ChildItem dist\*.whl).FullName
          Get-Content .\install.ps1 -Raw | Invoke-Expression
      - name: reanime runs, mpv found and plays
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          reanime --version
          ready="$(reanime --setup)" && echo "$ready"
          mpv="${ready#ready: }"
          # unquoted on purpose: "flatpak run io.mpv.Mpv" has to split into words
          $mpv --vo=null --ao=null --frames=10 av://lavfi:testsrc=duration=1
      - name: reanime runs, mpv found and plays
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          reanime --version
          $ready = reanime --setup
          $ready
          $mpv = $ready -replace '^ready: ', ''
          & $mpv --vo=null --ao=null --frames=10 av://lavfi:testsrc=duration=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  install-termux:
    # Termux userland in Docker: covers the installer's Termux branch (pkg + pip) and
    # the Android player hand-off. the mpv-android app itself can't run here.
    name: 4 · install (android / termux, experimental)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: install.sh inside termux-docker
        run: |
          docker run --rm -e TERMUX_VERSION=docker -e REANIME_YES=1 -v "$PWD:/src:ro" \
            termux/termux-docker:x86_64 bash -c '
              set -e
              export REANIME_PKG="$(ls /src/dist/*.whl)"
              sh < /src/install.sh
              reanime --version
              reanime --setup | grep -q is.xyz.mpv'

  live:
    # hits the real site: search, episode list, the flix server list, flixcloud's
    # download route, and the first bytes of an actual episode file. a failure here
    # with green tests means reanime or flixcloud changed something.
    name: 5 · live site check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: search + episode list
        run: python3 reanime.py "one piece" --list | tail -n 3
      - name: dub episode resolves to a real mkv
        run: |
          url="$(python3 reanime.py "one piece" 1151 --dub --print)"
          echo "::add-mask::$url"
          magic="$(curl -fsS -r 0-3 "$url" | od -An -tx1 | tr -d ' \n')"
          echo "first bytes: $magic"
          test "$magic" = "1a45dfa3"
      - name: sub episode resolves
        run: |
          url="$(python3 reanime.py "one piece" 1 --sub --print)"
          echo "::add-mask::$url"
          curl -fsS -r 0-3 -o /dev/null "$url"

  release:
    name: 6 · release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: tag matches __version__
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 reanime.py --version | cut -d' ' -f2)"
      - name: release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md > notes.md
          test -s notes.md && cat notes.md
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
